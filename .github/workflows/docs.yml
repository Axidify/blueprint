name: Docs and changelog

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation and changelog
        run: python -I tools/check_docs.py
      - name: Require a changelog entry for app changes in pull requests
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || git diff --name-only FETCH_HEAD HEAD)
          app=$(echo "$changed" | grep -v -E '^(docs/|README\.md$|CHANGELOG\.md$|VERSION$)' || true)
          if [ -n "$app" ] && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "App files changed without a CHANGELOG.md entry:"; echo "$app"; exit 1
          fi

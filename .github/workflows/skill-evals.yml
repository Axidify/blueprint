name: Skill evaluations

# Runs the cases in evals/ with Claude Code's evaluator (`claude plugin eval`), against real models, so it
# costs money: only on demand from the Actions tab and once a week, never on every push. Skipped when the
# repository has no ANTHROPIC_API_KEY secret. See docs/maintaining.md, "Skill evaluations".

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Only the cases whose name matches this (a name or a glob); empty for all"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"   # Mondays, 03:00 UTC

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CASE: ${{ github.event.inputs.case }}
      MAX_COST_USD: "5"        # the run stops before going over this (exit code 2)
      EVAL_MODEL: claude-sonnet-5
      JUDGE_MODEL: claude-haiku-4-5
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::No ANTHROPIC_API_KEY secret, so the skill evaluations were skipped."
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: "22"
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the suite is well formed
        if: env.ANTHROPIC_API_KEY != ''
        run: python3 -I tools/check_docs.py
      - name: Run the skill evaluations
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          mkdir -p evals/results
          claude plugin eval . ${CASE:+--case "$CASE"} \
            --trust-plugin \
            --runs 1 \
            --ablation none \
            --threshold 0.8 \
            --model "$EVAL_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --max-cost-usd "$MAX_COST_USD" \
            --no-publish \
            --json evals/results/results.json
      - name: Keep the report
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: skill-evals
          path: evals/results/
          if-no-files-found: ignore

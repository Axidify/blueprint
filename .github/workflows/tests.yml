name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    # Linux has no Microsoft Word, so this also proves documents are generated without it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      # As setup does. With them, the tests that take screenshots run too, in the Google Chrome the runner has.
      - name: Install Node packages
        run: npm install --no-save --no-audit --no-fund
      - name: Installing leaves the lock file as it was cloned
        run: git diff --exit-code package-lock.json
      - name: Run the tests
        run: python -m pytest

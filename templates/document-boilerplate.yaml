# Standard document wording. Placeholders: {system} {client} {client_short} {company} {company_short}
# Copy to workspace/branding/document-boilerplate.yaml to change it for your company.

disclaimer:
  - "This document sets out the requirements for {system}, as gathered in the requirement workshops between {client} and {company} ({company_short}). It remains a draft until both parties have signed it, and its content may change until then."

confidentiality:
  - "This document is confidential to {client} and {company}. It shall not be disclosed, copied or passed to a third party without the written consent of both, and is to be used only to agree the requirements and to deliver the project."

concept:
  - "The screens shown are conceptual. They show what the system does and what each role sees; colours, labels and layout may be refined during development without changing the behaviour agreed in this document."

mockup_intro: "The screens below are taken from the conceptual mock-up with sample data. Labels, layouts and colours are subject to refinement during development."

scope_intro: "What this version of {system} covers, what it leaves out, and what has been assumed. Work outside this scope is agreed separately as a change request."

decisions_made_intro: "Questions raised during the requirement study and the answers given. These answers are part of what is signed."

open_issues_intro: "The following items remain open at the time of this version. They shall be resolved before sign-off or carried forward as agreed by both parties; resolutions may affect the scope, timeline and effort."

signoff:
  - "By signing, the client confirms that this document, the {system} – {document}, describes the requirements agreed for the system. It is the basis for development and for acceptance testing."
  - "Decisions listed as open in this document are not covered by the signature until they are resolved and recorded in a later version."
  - "A change, addition or removal requested after sign-off is a change request: it is assessed for its effect on scope, timeline and cost, and proceeds once both parties agree."
  - "The client will provide in good time what the project depends on: details of the external systems, access to the environments, test data and contacts for technical support."

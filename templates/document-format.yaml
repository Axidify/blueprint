# How generated requirements documents look and are structured. This is Blueprint's default design: calm greys,
# one accent colour, Geist type, hairline tables, status shown as a dot and a word.
#
# To change it for your company, copy this file to workspace/branding/document-format.yaml and edit it there
# (or ask Blueprint: "make our document headings navy", "number sections 1.0, 2.0"). Only the keys you set
# are changed; everything else keeps the values below.

document:
  title: Requirements Specification   # on the cover and in file names, e.g. "System Requirement Specifications"
  short: ""                           # optional abbreviation shown on the cover and in file properties, e.g. SRS

fonts:
  body: Geist                 # installed by setup.cmd; Word falls back to a similar font if missing
  heading: Geist Medium
  mono: Geist Mono            # IDs, versions and reference formats

sizes:                        # points
  body: 10
  table: 9
  table_header: 8.5
  caption: 8.5
  h1: 18
  h2: 13.5
  h3: 11.5
  cover_title: 26

colors:                       # six hex digits; quote a value made of digits only ("112233")
  text: 1D1D1F
  secondary: 6E6E73
  separator: E5E5EA           # lines between table rows
  line: D2D2D7                # line under table headers
  field: E9E9EE               # tag background
  ground: F5F5F7              # summary cards and screenshot frames
  accent: 1F5FBF              # links and the one figure that matters on a page
  ok: 34C759
  warning: FF9500
  error: FF3B30
  timeline_bar: C9D8EF        # timeline bars; client activities use the accent
  heading: ""                 # chapter and section headings; empty: the text colour

tables:                       # how tables look; the default is hairlines and no fill
  header_fill: ""             # a colour for the header row, e.g. "1F3864" for navy; empty: no fill
  header_text: ""             # header text colour; empty: grey, or white on a filled header
  borders: hairline           # hairline: a line under each row   grid: a box round every cell

numbering: plain              # plain: 1, 1.1, 1.2   decimal: 1.0, 1.1, 1.2

layout:
  screens_new_page: true      # every screen in the Screens chapter starts on a new page (false: run them on)
header_footer: generated      # generated: system, version and status on top, company and page number below
                              # template: keep the header and footer of branding/document-template.docx

# Front matter, in order. Remove an entry to leave it out.
front: [cover, at_a_glance, about, contents]

# Numbered chapters, in order. Remove an entry to leave it out (sign-off is never numbered).
chapters: [users_access, scope, by_role, requirements, screens, nfr, timeline, extras, decisions, signoff]

titles:
  users_access: Users and access
  scope: Scope and assumptions
  by_role: Requirements by role
  requirements: Functional requirements
  screens: Screens
  nfr: Non-functional requirements
  timeline: Project timeline
  decisions: Decisions needed before sign-off
  signoff: Client acknowledgement and sign-off
  at_a_glance: Document at a glance
  about: About this document

labels:
  impact_high: Blocks sign-off
  impact_medium: Needs an answer
  impact_low: Clarification
  decision_needed: Decision needed
  decisions_needed: Decisions needed
  sow_mandays: Effort by scope of work item   # timeline: the scope of work's mandays per item
  decisions_made: Decisions made
  default_status: Draft for client review
  confidential: Confidential
  signing: What you are signing            # sign-off: under "Version 0.2", with the document's date
  not_signed: Not part of this sign-off    # sign-off: under "3 decisions still open", with their section
  nothing_left_out: Nothing is left out of it
  how_to_sign: How to sign (see below)
